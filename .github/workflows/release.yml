name: Release

# A merge publishes. The pull request rehearsal of this same pipeline runs inside
# the CI workflow's single macOS job, on the machine whose compilation cache the
# verify build just filled, so a pull request occupies one runner slot rather than
# two.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# One group per ref, and a real release is never cancelled by a newer one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# The caller must grant every permission the called workflow's jobs request.
permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    uses: agoodkind/swift-makefile/.github/workflows/_release.yml@main
    with:
      # The release links WireGuardKitGo exactly as CI does, and that target builds
      # a Go c-archive through its own Makefile whose goroot prepare step fails
      # unless `go env GOROOT` resolves. The macos-26 runner does not put Go on the
      # build PATH. ci.yml already installs it for the same reason; without the same
      # line here the release build fails at `[ -n "" ]` in the bridge's prepare step.
      brew-packages: go
      # Without this the shared pipeline treats a merge as manual, resolves the release
      # as not enabled, and skips every job, which is why this repo has run the workflow
      # and published nothing.
      #
      # Pre-release rather than stable while this app has never shipped: every merge
      # publishes something a person can download, marked as not the recommended build,
      # and a run that proves itself is promoted to stable deliberately.
      release-on-merge: prerelease
      # Developer ID here, Apple Distribution in CI. Both come from repository
      # variables, and each keeps its own so the two are never confused.
      signing-identity-name: ${{ vars.APPLE_DEVELOPER_ID_IDENTITY }}
      apple-team-id: ${{ vars.APPLE_TEAM_ID }}
      # The agent embeds a packet tunnel extension, so its targets carry App Groups
      # and Network Extensions entitlements, and Xcode refuses to sign those without
      # a provisioning profile that grants them. CI provisions its own App Store
      # profiles through fastlane, but a Developer ID build cannot use those, so the
      # release installs the stored Developer ID profile instead. Without this the
      # build reaches signing and stops at "requires a provisioning profile with the
      # App Groups and Network Extensions features".
      install-provisioning-profile: true
      notarize-pattern: "*.dmg"
      candidate-asset-pattern: "*.dmg"
      # After publishing, download the image, check its staple and Developer ID
      # signature, then run the command-line tool inside it and require the output to
      # name this release. That is the only step that proves the published artifact
      # runs, rather than only that it built.
      smoke-asset: "CellTunnel.dmg"
      smoke-binary: "celltunnelctl"
      sbom-subject-path: "Products/Release/CellTunnelAgent.app"
    # Named rather than inherited, because this app needs three provisioning
    # profiles and a secret holds at most 48 KB, which two profiles nearly fill.
    # The shared pipeline installs one profile per line of the value it is given,
    # so the third travels in its own secret and is joined here. A caller chooses
    # either `inherit` or a named map, so naming one secret means naming them all.
    secrets:
      APPLE_DEVELOPER_ID_PROFILE_BASE64: |
        ${{ secrets.APPLE_DEVELOPER_ID_PROFILE_BASE64 }}
        ${{ secrets.APPLE_DEVELOPER_ID_PROFILE_CATALYST_BASE64 }}
      APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
      APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
      APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      LOCAL_POOL_CAPACITY_TOKEN: ${{ secrets.LOCAL_POOL_CAPACITY_TOKEN }}
