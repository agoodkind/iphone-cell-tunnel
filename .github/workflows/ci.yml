name: CI

on:
  pull_request:
    branches:
      - main
  # Build on merges to main so the branch-scoped compile cache is populated on the
  # default branch. A pull request reads only its own branch's cache and main's, so
  # without a main build every pull request starts from a cold cache.
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# The caller must grant every permission the called workflow's jobs request.
permissions:
  contents: read
  actions: read

jobs:
  swift:
    uses: agoodkind/swift-makefile/.github/workflows/_ci.yml@main
    with:
      runner: macos-26
      fetch-depth: "0"
      # The vendored wireguard-apple WireGuardKitGo target builds a Go c-archive
      # (libwg-go.a) through its own Makefile, whose goroot prepare step fails
      # unless `go env GOROOT` resolves. The macos-26 runner does not put Go on the
      # build PATH, so install it through brew; the WireGuardKitGo Makefile already
      # adds /opt/homebrew/bin to PATH, which is where brew installs go. The shared
      # required jobs and the signed macOS build all link WireGuardKitGo.
      brew-packages: go
      # Sign every product in one Verify job. SWIFT_VERIFY_BUILD_CMD (`build all`)
      # builds the Mac agent and tunnel, the Catalyst app, the iPhone simulator app,
      # the iPhone device app, and the daemon. These targets carry App Groups and
      # Network Extension entitlements, so each needs a provisioning profile. The CI
      # runner is not a registered device, so development provisioning cannot work;
      # only App Store distribution profiles, which carry no device list, sign there.
      #
      # import-signing-cert imports whichever certificates the secrets carry, and
      # signing-identity-name below picks the one that signs. This repository holds
      # two: APPLE_DISTRIBUTION_P12_* for CI, named here, and APPLE_DEVELOPER_ID_P12_*
      # for the release, because an App Store certificate cannot sign an app someone
      # downloads. Until both secrets existed, the Developer-ID-named one carried the
      # distribution certificate and a release could not be signed at all.
      #
      # The ci-provision setup step runs fastlane before the build to
      # create or renew one App Store profile per target through the App Store Connect
      # API key (APPLE_NOTARY_*), so profiles never expire out from under CI;
      # Project.swift pins each profile by name. TUIST_DEVELOPER_ID_SIGNING selects the
      # project's distribution signing mode. install-provisioning-profile is not set,
      # because fastlane provisions instead. SWIFT_MK_VERIFY_SIGNING_ROOTS verifies each
      # runnable product is signed with the team and is not ad-hoc.
      import-signing-cert: true
      signing-identity-name: "Apple Distribution: Alex Goodkind (H3BMXM4W7H)"
      apple-team-id: H3BMXM4W7H
      setup-target: ci-provision
      make-args: TUIST_DEVELOPER_ID_SIGNING=1
    secrets: inherit
